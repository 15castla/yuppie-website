<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Yuppie</title>
<style>
  :root { color-scheme: light; }
  html, body {
    margin: 0;
    height: 100%;
    background: #FFD904;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1B1512;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top));
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    box-sizing: border-box;
  }
  /* Real wordmark (public/yuppie_logo_forte_forward.png on the main site,
     same flat near-black raster PNG used in the site's own hero and header
     — see components/templates/creative-studio/hero.tsx), not the square
     app icon this page used before. Sized as a share of the viewport width
     so it scales across phone sizes the way the site's own hero logo does,
     capped so it never gets silly-huge on a tablet-size simulator. */
  /* Vertical rhythm: 24px wordmark -> heading, 12px heading -> paragraph,
     24px paragraph -> button. Tight in the middle, generous at the ends,
     the same pattern as the app's sign-in screen
     (app/member-login/member-login-form-native.tsx). */
  .wordmark {
    width: min(240px, 60vw);
    height: auto;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }
  p {
    font-size: 15px;
    /* --foreground-muted from app/globals.css, not an ad-hoc opacity, so
       this reads the same muted tone the rest of the site uses. Static —
       this copy never changes, including while a retry is in flight or
       after one fails, so the screen doesn't shift underneath someone
       who's already read it once. Only the button communicates state. */
    color: #6B6560;
    max-width: 320px;
    margin: 0 0 24px;
    line-height: 1.5;
  }
  /* Matches components/Button.tsx's buttonBaseClasses exactly (rounded-full
     bg-[#1B1512] px-10 py-4 text-base font-bold text-[#FFD904], hover:
     scale-[1.03] hover:bg-[#2A2420]) so this is visibly the same button as
     everywhere else in the app, not a lookalike built from scratch.
     touch-action + the transparent tap-highlight stop WKWebView's
     tap-vs-scroll/zoom disambiguation delay from making this feel
     unresponsive — a known WKWebView quirk, not network latency, since
     the loading state below is applied synchronously on tap. The 0.1s
     transform transition (vs. 0.2s for color/opacity) keeps the press
     animation itself feeling immediate rather than laggy. */
  button {
    position: relative;
    appearance: none;
    border: none;
    background: #1B1512;
    color: #FFD904;
    font-size: 16px;
    font-weight: 700;
    padding: 16px 40px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.1s ease-out, background-color 0.2s ease-out, opacity 0.2s ease-out;
  }
  button:hover {
    background: #2A2420;
    transform: scale(1.03);
  }
  button:active {
    transform: scale(0.98);
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
    transform: none;
  }
  /* Loading state: the label ("Try again") only goes invisible, it's never
     removed from layout (visibility, not display) — so it keeps reserving
     its own footprint and the button's size can't change. The spinner is
     positioned absolutely, entirely outside that flex flow, and centered
     over the button with its own transform — so it lands dead-center
     regardless of how wide the label is, instead of being centered as a
     flex sibling alongside it (which is what was pushing "Try again" off
     to one side). button:disabled above already covers "can't be tapped
     again mid-check". */
  button.loading .label {
    visibility: hidden;
  }
  .spinner {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 16px;
    height: 16px;
    margin: -8px 0 0 -8px;
    border: 2px solid rgba(255, 217, 4, 0.35);
    border-top-color: #FFD904;
    border-radius: 50%;
    visibility: hidden;
  }
  button.loading .spinner {
    visibility: visible;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    button.loading .spinner {
      animation: none;
    }
  }
</style>
</head>
<body>
  <img class="wordmark" src="yuppie_logo_forte_forward.png" alt="Yuppie" />
  <h1>You&rsquo;re offline</h1>
  <p>Yuppie needs an internet connection to load. Check your Wi-Fi or mobile data, then try again.</p>
  <button id="retry" type="button">
    <span class="label">Try again</span>
    <span class="spinner" aria-hidden="true"></span>
  </button>

<script>
  // This page only ever loads as a native-side fallback, when the initial
  // load of the real site (capacitor.config.ts's server.url) fails because
  // there's no connectivity at all. See capacitor.config.ts's server.errorPath
  // — Capacitor's own built-in navigation-failure handling on both platforms
  // loads this bundled page automatically, no custom native code needed.
  //
  // window.Capacitor.Plugins.<Name> is Capacitor's plugin bridge, exposed
  // globally on every page (including this plain, non-bundled one)
  // regardless of the ESM import style the main app uses.
  var retryBtn = document.getElementById("retry");
  var SITE_URL = "https://clubyuppie.com/member-login"; // replaced at build/sync time, see scripts/inject-server-url.cjs

  // A failure with no connection at all comes back almost instantly; the
  // spinner stays up at least this long so that doesn't read as a flash
  // where nothing happened. A slower real attempt isn't padded.
  var MIN_SPINNER_MS = 1100;
  // Upper bound on the attempt itself, so a connection that hangs rather
  // than failing outright still hands the button back.
  var ATTEMPT_TIMEOUT_MS = 15000;
  var attempting = false;

  // A real request to the server, rather than Network.getStatus(), which
  // only reports the OS's cached reachability flag: that can say
  // "connected" with no route to the server, or "offline" after one has
  // come back. no-cors since only reachability matters (the response is
  // opaque); no-store so a cached copy can't answer for the network.
  function probeServer() {
    var controller = typeof AbortController === "function" ? new AbortController() : null;
    var timer = controller && setTimeout(function () { controller.abort(); }, ATTEMPT_TIMEOUT_MS);
    return fetch(SITE_URL, {
      method: "HEAD",
      mode: "no-cors",
      cache: "no-store",
      signal: controller ? controller.signal : undefined,
    }).then(
      function () { clearTimeout(timer); return true; },
      function () { clearTimeout(timer); return false; }
    );
  }

  function attemptReturn() {
    if (attempting) return;
    attempting = true;
    retryBtn.disabled = true;
    retryBtn.classList.add("loading");
    retryBtn.setAttribute("aria-busy", "true");
    var minSpinner = new Promise(function (resolve) { setTimeout(resolve, MIN_SPINNER_MS); });
    Promise.all([probeServer(), minSpinner]).then(function (results) {
      if (results[0]) {
        // Server answered: reload the WebView against it. The spinner
        // stays up through the navigation. If the load itself still
        // fails, Capacitor brings this page back (server.errorPath).
        window.location.href = SITE_URL;
        return;
      }
      // Still unreachable: drop back to the idle "Try again" state. The
      // message above doesn't change — it already says what's wrong.
      attempting = false;
      retryBtn.disabled = false;
      retryBtn.classList.remove("loading");
      retryBtn.removeAttribute("aria-busy");
    });
  }

  retryBtn.addEventListener("click", attemptReturn);

  // Auto-retry the instant connectivity comes back, so a member doesn't
  // have to notice and tap the button themselves.
  var Network = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Network;
  if (Network && Network.addListener) {
    Network.addListener("networkStatusChange", function (status) {
      if (status && status.connected) {
        attemptReturn();
      }
    });
  }
</script>
</body>
</html>
