<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Club Yuppie</title>
<!-- Shown by public/members-sw.js when the phone has no signal and the page asked for was never opened on it, so
     there is no saved copy (13 Nov 2026). Self-contained: the worker keeps this file and the wordmark. The same look
     as the app's own offline screen (mobile/www-placeholder/offline.html). -->
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; min-height: 100%; background: #FFD904; color: #1B1512;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    min-height: 100vh; box-sizing: border-box; padding: 24px;
    padding-top: calc(24px + var(--native-safe-area-inset-top, env(safe-area-inset-top, 0px)));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .wordmark { width: min(200px, 52vw); height: auto; margin-bottom: 28px; }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 12px; }
  p { font-size: 16px; line-height: 1.5; color: #6B6560; max-width: 320px; margin: 0 0 28px; }
  .acts { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; }
  button { appearance: none; border: 2px solid #1B1512; border-radius: 999px; min-height: 56px; padding: 0 32px;
    font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent; }
  .primary { background: #1B1512; color: #FFD904; }
  .outline { background: transparent; color: #1B1512; }
</style>
</head>
<body>
  <main style="display: contents">
    <img class="wordmark" src="/yuppie_logo_forte_forward.png" alt="Club Yuppie" />
    <h1>You&rsquo;re offline</h1>
    <p>This page isn&rsquo;t saved on your phone yet. Pages you&rsquo;ve opened before still work without a signal.</p>
    <div class="acts">
      <button class="primary" type="button" id="back">Go back</button>
      <button class="outline" type="button" id="retry">Try again</button>
    </div>
  </main>
<script>
  document.getElementById("back").addEventListener("click", function () {
    if (history.length > 1) history.back();
    else location.href = "/members";
  });
  document.getElementById("retry").addEventListener("click", function () { location.reload(); });
  // Back online while this is showing: open the page that was asked for, once the connection has held for a moment
  // (an "online" that comes and goes, or one fired as another page is opening, does nothing).
  window.addEventListener("online", function () {
    setTimeout(function () {
      if (navigator.onLine && document.visibilityState === "visible") location.reload();
    }, 1500);
  });
</script>
</body>
</html>
